services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI, reachable from this machine only. The app sends traces over the compose network.
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411 # Enable Zipkin compatibility

  app:
    build: .
    image: find-that-book
    ports:
      - "8080:8080"
    environment:
      Ai__Provider: ${AI_PROVIDER:-Gemini}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
      OpenAiCompatible__ApiKey: ${OPENAI_API_KEY:-}
      OpenAiCompatible__BaseUrl: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1/}
      OpenAiCompatible__Model: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      OpenLibrary__BaseUrl: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org/}
      OpenLibrary__MaxDetailLookups: ${OPENLIBRARY_MAX_DETAIL_LOOKUPS:-6}
      OpenLibrary__MaxAuthorsPerWork: ${OPENLIBRARY_MAX_AUTHORS_PER_WORK:-3}
      OpenLibrary__MaxConcurrentRequests: ${OPENLIBRARY_MAX_CONCURRENT_REQUESTS:-2}
      OpenLibrary__DefaultCooldownSeconds: ${OPENLIBRARY_DEFAULT_COOLDOWN_SECONDS:-30}
      OpenLibrary__Contact: ${OPENLIBRARY_CONTACT:-}
      Telemetry__Enabled: ${TELEMETRY_ENABLED:-false}
      Telemetry__LogHttpBodies: ${TELEMETRY_LOG_HTTP_BODIES:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-find-that-book}
    restart: unless-stopped
