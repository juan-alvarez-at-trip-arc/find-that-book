services:
  app:
    build: .
    image: find-that-book
    ports:
      - "8080:8080"
    environment:
      Ai__Provider: ${AI_PROVIDER:-Gemini}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
      OpenAiCompatible__ApiKey: ${OPENAI_API_KEY:-}
      OpenAiCompatible__BaseUrl: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1/}
      OpenAiCompatible__Model: ${OPENAI_MODEL:-openai/gpt-oss-20b}
    restart: unless-stopped
