services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: jaeger
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI, reachable from this machine only. The app sends traces over the compose network.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    build: .
    image: find-that-book
    ports:
      - "8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RateLimit__SearchPermitsPerMinute: ${RATE_LIMIT_SEARCHES_PER_MINUTE:-10}
      RateLimit__MaxConcurrentSearches: ${RATE_LIMIT_MAX_CONCURRENT_SEARCHES:-8}
      Health__ExposeConfig: ${HEALTH_EXPOSE_CONFIG:-false}
      Ai__Provider: ${AI_PROVIDER:-Gemini}
      Ai__Temperature: ${AI_TEMPERATURE:-}
      Ai__TopK: ${AI_TOP_K:-}
      Ai__TopP: ${AI_TOP_P:-}
      Ai__Seed: ${AI_SEED:-}
      Ai__ReasoningEffort: ${AI_REASONING_EFFORT:-}
      Ai__Resilience__RetryCount: ${AI_RESILIENCE_RETRY_COUNT:-1}
      Ai__Resilience__RetryDelayMs: ${AI_RESILIENCE_RETRY_DELAY_MS:-300}
      Ai__Resilience__AttemptTimeoutMs: ${AI_RESILIENCE_ATTEMPT_TIMEOUT_MS:-30000}
      Ai__Resilience__TotalTimeoutMs: ${AI_RESILIENCE_TOTAL_TIMEOUT_MS:-45000}
      Ai__Resilience__BreakerFailureRatio: ${AI_RESILIENCE_BREAKER_FAILURE_RATIO:-0.5}
      Ai__Resilience__BreakerMinimumThroughput: ${AI_RESILIENCE_BREAKER_MINIMUM_THROUGHPUT:-4}
      Ai__Resilience__BreakerSamplingSeconds: ${AI_RESILIENCE_BREAKER_SAMPLING_SECONDS:-30}
      Ai__Resilience__BreakerBreakSeconds: ${AI_RESILIENCE_BREAKER_BREAK_SECONDS:-30}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
      OpenAiCompatible__ApiKey: ${OPENAI_API_KEY:-}
      OpenAiCompatible__BaseUrl: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1/}
      OpenAiCompatible__Model: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      OpenLibrary__BaseUrl: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org/}
      OpenLibrary__MaxDetailLookups: ${OPENLIBRARY_MAX_DETAIL_LOOKUPS:-6}
      OpenLibrary__MaxAuthorsPerWork: ${OPENLIBRARY_MAX_AUTHORS_PER_WORK:-3}
      OpenLibrary__MaxConcurrentRequests: ${OPENLIBRARY_MAX_CONCURRENT_REQUESTS:-2}
      OpenLibrary__DefaultCooldownSeconds: ${OPENLIBRARY_DEFAULT_COOLDOWN_SECONDS:-30}
      OpenLibrary__AttemptTimeoutMs: ${OPENLIBRARY_ATTEMPT_TIMEOUT_MS:-10000}
      OpenLibrary__CircuitBreakerFailureRatio: ${OPENLIBRARY_CIRCUIT_FAILURE_RATIO:-0.5}
      OpenLibrary__CircuitBreakerMinimumThroughput: ${OPENLIBRARY_CIRCUIT_MINIMUM_THROUGHPUT:-6}
      OpenLibrary__CircuitBreakerSamplingSeconds: ${OPENLIBRARY_CIRCUIT_SAMPLING_SECONDS:-30}
      OpenLibrary__CircuitBreakerBreakSeconds: ${OPENLIBRARY_CIRCUIT_BREAK_SECONDS:-20}
      OpenLibrary__Contact: ${OPENLIBRARY_CONTACT:-}
      Telemetry__Enabled: ${TELEMETRY_ENABLED:-false}
      Telemetry__LogHttpBodies: ${TELEMETRY_LOG_HTTP_BODIES:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-find-that-book}
    restart: unless-stopped

  quick-tunnel:
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: tunnel --no-autoupdate --url http://app:8080 # temporary public URL (https://*.trycloudflare.com), printed in this container's log and new on every start
    depends_on: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
