<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Find That Book</title>
    <meta name="description" content="Type what you remember about a book, a title, an author or a year, and get up to five ranked Open Library matches with a one-sentence reason for each." />
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Find That Book" />
    <meta property="og:title" content="Find That Book: what was that book?" />
    <meta property="og:description" content="Turn a half-remembered title, author or year into ranked Open Library matches, each with a short reason." />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Find That Book",
        "description": "Turns a messy text query into up to five ranked Open Library matches, each with a one-sentence explanation.",
        "applicationCategory": "UtilitiesApplication",
        "browserRequirements": "Requires JavaScript"
      }
    </script>
    <script>
      /* Apply a saved theme before first paint to avoid a flash; keep in sync with src/lib/theme.ts. */
      try {
        var m = localStorage.getItem("ftb-theme");
        if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Find That Book needs JavaScript to search. It turns what you remember about a book into ranked Open Library matches.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
